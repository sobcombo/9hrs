<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#142b4d">
<meta name="description" content="Daily operations associate staffing roster.">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<title>SOB - 9 Hrs. Daily OAs' Roster</title>
<style>
:root {
  color-scheme: light;
  --page:#f4f6fa;
  --surface:#fff;
  --ink:#18263b;
  --muted:#718096;
  --line:#e5eaf1;
  --navy:#142b4d;
  --blue:#315fe8;
  --blue-soft:#eef3ff;
  --amber:#865800;
  --amber-soft:#fff6e4;
  --shadow:0 12px 36px rgba(24,42,75,.06);
}
* {box-sizing:border-box;font-family:Manrope,Arial,sans-serif}
body {margin:0;padding:25px 16px;background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input {font:inherit}
input:focus-visible {outline:3px solid rgba(49,95,232,.25);outline-offset:2px}
.container {width:min(100%,860px);margin:0 auto}
.header {padding:14px 20px;border-radius:13px;background:linear-gradient(125deg,#142b4d,#234779);color:#fff;box-shadow:var(--shadow)}
h1 {margin:0;font-size:clamp(19px,3.5vw,24px);letter-spacing:-.55px}
.card {margin-top:14px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.inputs {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field label {display:block;margin-bottom:6px;color:#52617a;font-size:12px;font-weight:750}
.field input {width:100%;height:45px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:17px;font-weight:750}
.field input:focus {border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,95,232,.09);outline:0}
.availability {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px;padding:11px 15px;border-radius:10px;background:var(--blue-soft)}
.availability-label {color:#425477;font-size:13px;font-weight:700}
.availability-value {color:var(--blue);font-size:25px;font-weight:850;letter-spacing:-.8px}
.shifts {display:grid;gap:11px}
.shift {overflow:hidden;border:1px solid var(--line);border-radius:11px;background:#fff}
.shift-header {display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:#f8f9fc}
.shift-name {font-size:12px;font-weight:850;letter-spacing:.25px}
.shift-count {color:var(--blue);font-size:11px;font-weight:800;white-space:nowrap}
.location-list {margin:0;padding:0 14px;list-style:none}
.location-list li {display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,1fr);align-items:center;gap:12px;min-height:38px;border-top:1px solid #f0f2f6;font-size:12px}
.location-list li:first-child {border-top:0}
.location-name {color:#34445d;font-weight:700}
.location-category {color:var(--muted);text-align:center;font-size:11px;font-weight:600}
.empty-shift {margin:0;padding:11px 14px;border-top:1px solid #f0f2f6;color:var(--muted);font-size:12px}
.notice {margin-top:13px;padding:12px 14px;border-radius:10px;background:var(--amber-soft);color:var(--amber);font-size:12px;line-height:1.55}
.notice strong {display:block;margin-bottom:4px}
.notice ul {margin:4px 0 0;padding-left:19px}
.notice li {padding:2px 0}
.footer {padding:15px 8px 2px;color:var(--muted);font-size:10px;text-align:center;letter-spacing:.55px}
@media(max-width:520px) {
  body {padding:12px 9px}
  .header {padding:13px 15px}
  .card {padding:14px;border-radius:12px}
  .inputs {gap:8px}
  .field label {font-size:11px}
  .field input {height:43px;padding:0 8px;font-size:16px}
  .location-list li {grid-template-columns:minmax(0,1fr) minmax(125px,1fr);gap:7px;font-size:11px}
  .location-category {font-size:10px}
}
@media(max-width:350px) {
  .inputs {grid-template-columns:1fr}
  .field label {margin-bottom:4px}
}
@media print {
  body {padding:0;background:#fff}
  .container {width:100%}
  .header {padding:14px 18px;border-radius:0;background:#142b4d!important;box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .card {margin-top:10px;padding:12px;box-shadow:none;break-inside:avoid}
  .shift {break-inside:avoid}
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1>SOB - 9 Hrs. Daily OAs' Roster</h1>
  </header>

  <main>
    <section class="card" aria-label="Staff numbers">
      <div class="inputs">
        <div class="field">
          <label for="total">Total staff</label>
          <input id="total" type="number" min="0" step="1" value="39" inputmode="numeric">
        </div>
        <div class="field">
          <label for="wo">Week offs</label>
          <input id="wo" type="number" min="0" step="1" value="7" inputmode="numeric">
        </div>
        <div class="field">
          <label for="leave">Leaves</label>
          <input id="leave" type="number" min="0" step="1" value="2" inputmode="numeric">
        </div>
      </div>
      <div class="availability" aria-live="polite">
        <span class="availability-label">Staff available</span>
        <strong class="availability-value" id="sAvailable">30</strong>
      </div>
    </section>

    <section class="card" aria-label="Today's location roster">
      <div id="roster" class="shifts"></div>
      <div id="notStaffed" class="notice" role="status" aria-live="polite" hidden></div>
    </section>
  </main>
  <footer class="footer">SOB OPERATION · STAFF PLANNING</footer>
</div>

<script>
const shifts = [
  {name:"FIRST SHIFT",time:"09:30 - 06:30"},
  {name:"SECOND SHIFT",time:"10:00 - 07:00"},
  {name:"THIRD SHIFT",time:"11:00 - 08:00"},
  {name:"FOURTH SHIFT",time:"12:30 - 09:30"}
];

// The 27 core posts are staffed first; each following post opens as one more person is available.
const coreLocations = [
  {name:"280 FT",shift:0}, {name:"POS 1",shift:0},
  {name:"Group Counter",shift:1}, {name:"SGF 1",shift:1},
  {name:"270 FT",shift:1}, {name:"Upgrade (Steps)",shift:1},
  {name:"NAM 1",shift:1}, {name:"NAM 2",shift:1},
  {name:"WOK 1",shift:1}, {name:"WOK 2",shift:1},
  {name:"POS 2",shift:2}, {name:"POS 3",shift:2},
  {name:"GF POS 1",shift:2}, {name:"GF POS 2",shift:2},
  {name:"Divyanubhuti",shift:2},
  {name:"280 FT",shift:3}, {name:"270 FT",shift:3},
  {name:"Upgrade (Steps)",shift:3}, {name:"SGF 2",shift:3},
  {name:"L&F",shift:3}, {name:"VIP Gate",shift:3},
  {name:"NAM 3",shift:2}, {name:"NAM 4",shift:3}, {name:"NAM 5",shift:3},
  {name:"WOK 3",shift:2}, {name:"WOK 4",shift:3}, {name:"WOK 5",shift:3}
];

// Incremental priorities after the 27 compulsory posts.
const additionalLocations = [
  {name:"WOK 6",shift:3},
  {name:"POS 4",shift:2},
  {name:"Sangam",shift:3},
  {name:"NAM 6",shift:3},
  {name:"SGF 3",shift:3},
  {name:"WOK 7",shift:3},
  {name:"POS 5",shift:3},
  {name:"POS 6",shift:3},
  {name:"NAM 7",shift:3},
  {name:"POS 7",shift:3},
  {name:"POS 8",shift:3},
  {name:"NAM 8",shift:3}
];
const categoryOrder = ["Ticket Counter", "Statue", "Nij Aatma Manthan", "World of Krishna", "Park"];

function readInput(id) {
  const value = Number(document.getElementById(id).value);
  return Number.isFinite(value) ? Math.max(0, Math.floor(value)) : 0;
}

function categoryFor(name) {
  if (name.startsWith("WOK")) return "World of Krishna";
  if (name.startsWith("NAM")) return "Nij Aatma Manthan";
  if (name.startsWith("POS") || name.startsWith("GF POS") || name === "Group Counter" || name === "L&F") return "Ticket Counter";
  if (["280 FT", "270 FT", "Upgrade (Steps)"].includes(name) || name.startsWith("SGF")) return "Statue";
  return "Park";
}

function locationMarkup(item) {
  return '<li><span class="location-name">' + item.name + '</span><span class="location-category">' + categoryFor(item.name) + '</span></li>';
}

function render() {
  const total = readInput("total");
  const weekOffs = readInput("wo");
  const leaves = readInput("leave");
  const available = Math.max(0, total - weekOffs - leaves);
  const staffedCoreCount = Math.min(available, coreLocations.length);
  const staffedExtras = additionalLocations.slice(0, Math.max(0, available - coreLocations.length));
  const staffedLocations = [
    ...coreLocations.slice(0, staffedCoreCount),
    ...staffedExtras
  ];
  const uncoveredLocations = [
    ...coreLocations.slice(staffedCoreCount),
    ...additionalLocations.slice(staffedExtras.length)
  ];

  document.getElementById("sAvailable").textContent = available;
  document.getElementById("roster").innerHTML = shifts.map((shift, shiftIndex) => {
    const staffed = staffedLocations.filter(item => item.shift === shiftIndex);
    staffed.sort((a, b) => categoryOrder.indexOf(categoryFor(a.name)) - categoryOrder.indexOf(categoryFor(b.name)));
    const list = staffed.length
      ? '<ul class="location-list">' + staffed.map(locationMarkup).join("") + '</ul>'
      : '<p class="empty-shift">No locations staffed in this shift.</p>';
    return '<section class="shift" aria-label="' + shift.name + ' ' + shift.time + '"><div class="shift-header"><span class="shift-name">' + shift.name + ' · ' + shift.time + '</span><span class="shift-count">' + staffed.length + ' STAFF</span></div>' + list + '</section>';
  }).join("");

  const notStaffed = document.getElementById("notStaffed");
  const excessAbsences = Math.max(0, weekOffs + leaves - total);
  notStaffed.hidden = uncoveredLocations.length === 0 && excessAbsences === 0;
  if (excessAbsences > 0) {
    notStaffed.innerHTML = '<strong>Week offs and leaves exceed total staff by ' + excessAbsences + '.</strong>No staff are available for the roster.';
  } else if (uncoveredLocations.length > 0) {
    const heading = available < coreLocations.length
      ? '<strong>27 staff are needed for all compulsory locations.</strong>'
      : '<strong>Not staffed today</strong>';
    notStaffed.innerHTML = heading + '<ul>' + uncoveredLocations.map(item => '<li>' + item.name + ' · ' + categoryFor(item.name) + ' · ' + shifts[item.shift].name + '</li>').join("") + '</ul>';
  } else {
    notStaffed.innerHTML = '';
  }
}

["total", "wo", "leave"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
});
render();
</script>
</body>
</html>
