<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#142b4d">
    <meta name="description" content="Daily operations associate staffing roster.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >

    <title>SOB: 9 Hrs. Daily OAs' Roster</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23315b91'/%3E%3Ctext x='32' y='48' fill='%23fff' font-family='Arial,sans-serif' font-size='46' font-weight='700' text-anchor='middle'%3E9%3C/text%3E%3C/svg%3E"
    >

    <style>
      /* Theme */
      :root {
        color-scheme: light;
        --page: #f4f6fa;
        --surface: #fff;
        --ink: #18263b;
        --muted: #718096;
        --line: #e5eaf1;
        --navy: #142b4d;
        --blue: #315fe8;
        --blue-soft: #eef3ff;
        --amber: #865800;
        --amber-soft: #fff6e4;
        --shadow: 0 12px 36px rgba(24, 42, 75, .06);
      }

      /* Base styles and page layout */
      * {
        box-sizing: border-box;
        font-family: Manrope, Arial, sans-serif;
      }

      body {
        margin: 0;
        padding: 25px 16px;
        background: var(--page);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
      }

      input:focus-visible {
        outline: 3px solid rgba(49, 95, 232, .25);
        outline-offset: 2px;
      }

      .container {
        width: min(100%, 860px);
        margin: 0 auto;
      }

      .header {
        padding: 14px 20px;
        border-radius: 13px;
        background: linear-gradient(125deg, #142b4d, #234779);
        color: #fff;
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(19px, 3.5vw, 24px);
        letter-spacing: -.55px;
      }

      .card {
        margin-top: 14px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      /* Staff input fields */
      .inputs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        color: #52617a;
        font-size: 12px;
        font-weight: 750;
      }

      .number-control {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) 34px;
        align-items: stretch;
      }

      .number-control button {
        border: 1px solid var(--line);
        background: #f8f9fc;
        color: var(--navy);
        font-size: 20px;
        font-weight: 700;
        cursor: pointer;
      }

      .number-control button:first-child {
        border-radius: 9px 0 0 9px;
      }

      .number-control button:last-child {
        border-radius: 0 9px 9px 0;
      }

      .number-control button:hover {
        background: var(--blue-soft);
      }

      .number-control button:focus-visible {
        position: relative;
        z-index: 1;
        outline: 3px solid rgba(49, 95, 232, .25);
        outline-offset: 1px;
      }

      .field input {
        width: 100%;
        height: 45px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-right: 0;
        border-left: 0;
        border-radius: 0;
        background: #fff;
        color: var(--ink);
        font-size: 17px;
        font-weight: 750;
        text-align: center;
      }

      .field input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(49, 95, 232, .09);
        outline: 0;
      }

      .field-warning {
        display: block;
        min-height: 0;
        margin-top: 5px;
        color: #c62828;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.4;
      }

      .field-warning:empty {
        display: none;
      }

      .threshold-message {
        margin: 0;
        padding: 30px 16px;
        color: var(--navy);
        font-size: clamp(25px, 6vw, 40px);
        font-weight: 850;
        text-align: center;
      }

      .surplus-message {
        margin: 13px 0 0;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--blue-soft);
        color: var(--blue);
        font-size: 13px;
        font-weight: 800;
        text-align: center;
      }

      .availability {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 13px;
        padding: 11px 15px;
        border-radius: 10px;
        background: var(--blue-soft);
      }

      .availability-label {
        color: #425477;
        font-size: 13px;
        font-weight: 700;
      }

      .availability-value {
        color: var(--blue);
        font-size: 25px;
        font-weight: 850;
        letter-spacing: -.8px;
      }

      /* Generated shift and location lists */
      .shifts {
        display: grid;
        gap: 11px;
      }

      .shift {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #fff;
      }

      .shift-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 11px 14px;
        background: #f8f9fc;
      }

      .shift-name {
        font-size: 12px;
        font-weight: 850;
        letter-spacing: .25px;
      }

      .shift-count {
        color: var(--blue);
        font-size: 11px;
        font-weight: 800;
        white-space: nowrap;
      }

      .location-list {
        margin: 0;
        padding: 0 14px;
        list-style: none;
      }

      .location-list li {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(150px, 1fr);
        align-items: center;
        gap: 12px;
        min-height: 38px;
        border-top: 1px solid #f0f2f6;
        font-size: 12px;
      }

      .location-list li:first-child {
        border-top: 0;
      }

      .location-name {
        color: #34445d;
        font-weight: 700;
      }

      .location-category {
        color: var(--muted);
        text-align: center;
        font-size: 11px;
        font-weight: 600;
      }

      .empty-shift {
        margin: 0;
        padding: 11px 14px;
        border-top: 1px solid #f0f2f6;
        color: var(--muted);
        font-size: 12px;
      }

      /* Alerts and footer */
      .notice {
        margin-top: 13px;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--amber-soft);
        color: var(--amber);
        font-size: 12px;
        line-height: 1.55;
      }

      .notice strong {
        display: block;
        margin-bottom: 4px;
      }

      .notice ul {
        margin: 4px 0 0;
        padding-left: 19px;
      }

      .notice li {
        padding: 2px 0;
      }

      .print-sheet,
      .multiple-print-sheet {
        display: none;
      }

      .print-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .print-button {
        display: block;
        margin: 14px 0 0;
        padding: 11px 20px;
        border: 0;
        border-radius: 9px;
        background: var(--blue);
        color: #fff;
        font-weight: 800;
        cursor: pointer;
      }

      .print-button:hover {
        background: #244cc4;
      }

      .print-button:focus-visible {
        outline: 3px solid rgba(49, 95, 232, .3);
        outline-offset: 3px;
      }

      .footer {
        padding: 15px 8px 2px;
        color: var(--muted);
        font-size: 10px;
        text-align: center;
        letter-spacing: .55px;
      }

      /* Responsive layout */
      @media (max-width: 520px) {
        body {
          padding: 12px 9px;
        }

        .header {
          padding: 13px 15px;
        }

        .card {
          padding: 14px;
          border-radius: 12px;
        }

        .inputs {
          gap: 8px;
        }

        .field label {
          font-size: 11px;
        }

        .number-control {
          grid-template-columns: 27px minmax(0, 1fr) 27px;
        }

        .field input {
          height: 43px;
          padding: 0 4px;
          font-size: 16px;
        }

        .location-list li {
          grid-template-columns: minmax(0, 1fr) minmax(125px, 1fr);
          gap: 7px;
          font-size: 11px;
        }

        .location-category {
          font-size: 10px;
        }
      }

      @media (max-width: 350px) {
        .inputs {
          grid-template-columns: 1fr;
        }

        .field label {
          margin-bottom: 4px;
        }
      }

      /* Print layout */
      @page {
        size: A4 portrait;
        margin: 12mm;
      }

      @media print {
        @page {
          size: A4 portrait;
          margin: 9mm;
        }

        body {
          padding: 0;
          background: #fff;
          color: #18263b;
        }

        .container {
          width: 100%;
          margin: 0;
        }

        .container > :not(.print-sheet):not(.multiple-print-sheet) {
          display: none !important;
        }

        .print-sheet {
          display: block;
        }

        .print-title {
          width: fit-content;
          margin: 0 auto 8px;
          padding-bottom: 3px;
          border-bottom: 1px solid #142b4d;
          color: #142b4d;
          font-size: 18px;
          text-align: center;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }

        .print-summary {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 5px;
          margin-bottom: 9px;
        }

        .print-summary span {
          padding: 5px 3px;
          border: 1px solid #dce2eb;
          border-radius: 4px;
          font-size: 10px;
          font-weight: 700;
          text-align: center;
        }

        .print-shifts {
          display: block;
        }

        .print-shift {
          overflow: hidden;
          margin-bottom: 5px;
          border: 1px solid #cfd6e1;
          break-inside: avoid;
        }

        .print-shift:last-child {
          margin-bottom: 0;
        }

        .print-shift h2 {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          margin: 0;
          padding: 5px 8px;
          background: #eef1f6 !important;
          font-size: 11px;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }

        .print-shift h2 span:first-child {
          display: inline-block;
          align-self: center;
          padding-bottom: 3px;
          border-bottom: 1px solid #142b4d;
        }

        .print-shift h2 span:last-child {
          text-align: right;
          white-space: nowrap;
        }

        .print-shift ul {
          display: block;
          margin: 0;
          padding: 0 8px;
          list-style: none;
        }

        .print-shift li {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          align-items: center;
          gap: 10px;
          min-height: 19px;
          padding: 3px 0;
          border-bottom: 1px solid #edf0f4;
          font-size: 11px;
          line-height: 1.25;
        }

        .print-location-name {
          font-weight: 700;
        }

        .print-location-category {
          color: #59677b;
          text-align: center;
        }

        .print-staff-name {
          min-height: 13px;
          border-bottom: 1px dotted #b8c0cc;
        }

        body.multiple-print .container > :not(.multiple-print-sheet) {
          display: none !important;
        }

        body.multiple-print .print-sheet {
          display: none !important;
        }

        body.multiple-print .multiple-print-sheet {
          display: block;
        }

        .multiple-print-grid {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          margin-top: 8px;
          border-top: 1px solid #cfd6e1;
          border-bottom: 1px solid #cfd6e1;
        }

        .multiple-print-column {
          min-width: 0;
          padding: 5px 6px;
          border-left: 1px solid #cfd6e1;
          break-inside: avoid;
        }

        .multiple-print-column:last-child {
          border-right: 1px solid #cfd6e1;
        }

        .multiple-print-column h2 {
          margin: 0 0 5px;
          padding: 0 0 4px;
          border-bottom: 1px solid #dce2eb;
          color: #142b4d;
          font-size: 10px;
          text-align: center;
        }

        .multiple-print-shift {
          margin-top: 10px;
        }

        .multiple-print-shift h3 {
          margin: 0;
          padding: 2px 0;
          background: #eef1f6 !important;
          font-size: 9px;
          text-align: center;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }

        .multiple-print-shift ul {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .multiple-print-shift li {
          padding: 2px 1px;
          border-bottom: 1px solid #edf0f4;
          color: #000;
          font-size: 9px;
          font-weight: 700;
          line-height: 1.2;
          overflow-wrap: anywhere;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header class="header">
        <h1>SOB: 9 Hrs. Daily OAs' Roster</h1>
      </header>

      <main>
        <section class="card" aria-label="Staff numbers">
          <div class="inputs">
            <div class="field">
              <label for="total">Total Staff</label>
              <div class="number-control">
                <button type="button" data-step="-1" data-target="total" aria-label="Decrease total staff">−</button>
                <input
                  id="total"
                  type="number"
                  min="0"
                  step="1"
                  value="39"
                  inputmode="numeric"
                >
                <button type="button" data-step="1" data-target="total" aria-label="Increase total staff">+</button>
              </div>
            </div>

            <div class="field">
              <label for="wo">Week offs</label>
              <div class="number-control">
                <button type="button" data-step="-1" data-target="wo" aria-label="Decrease week offs">−</button>
                <input
                  id="wo"
                  type="number"
                  min="0"
                  step="1"
                  value="7"
                  inputmode="numeric"
                  aria-describedby="woWarning"
                >
                <button type="button" data-step="1" data-target="wo" aria-label="Increase week offs">+</button>
              </div>
              <span class="field-warning" id="woWarning" aria-live="polite"></span>
            </div>

            <div class="field">
              <label for="leave">Leaves</label>
              <div class="number-control">
                <button type="button" data-step="-1" data-target="leave" aria-label="Decrease leaves">−</button>
                <input
                  id="leave"
                  type="number"
                  min="0"
                  step="1"
                  value="2"
                  inputmode="numeric"
                  aria-describedby="leaveWarning"
                >
                <button type="button" data-step="1" data-target="leave" aria-label="Increase leaves">+</button>
              </div>
              <span class="field-warning" id="leaveWarning" aria-live="polite"></span>
            </div>
          </div>

          <div class="availability" aria-live="polite">
            <span class="availability-label">Staff available</span>
            <strong class="availability-value" id="sAvailable">30</strong>
          </div>
        </section>

        <section class="card" aria-label="Today's location roster">
          <div id="roster" class="shifts"></div>
          <div
            id="notStaffed"
            class="notice"
            role="status"
            aria-live="polite"
            hidden
          ></div>
        </section>
      </main>

      <div class="print-actions">
        <button class="print-button" id="printRoster" type="button">Print Roster</button>
        <button class="print-button" id="printMultiple" type="button">Print Multiple</button>
      </div>
      <footer class="footer">SOB OPERATION · STAFF PLANNING</footer>

      <section class="print-sheet" aria-label="Printable complete roster">
        <h1 class="print-title">SOB: 9 Hrs. Daily OAs' Roster</h1>
        <div class="print-summary" id="printSummary"></div>
        <div class="print-shifts" id="printShifts"></div>
      </section>

      <section class="multiple-print-sheet" aria-label="Printable rosters for 27 to 30 available staff">
        <h1 class="print-title">SOB: 9 Hrs. Daily OAs' Roster</h1>
        <div class="multiple-print-grid" id="multiplePrintGrid"></div>
      </section>
    </div>

    <script>
      // Shift names and their displayed time ranges.
      const shifts = [
        { name: "FIRST SHIFT", time: "09:30 - 06:30" },
        { name: "SECOND SHIFT", time: "10:00 - 07:00" },
        { name: "THIRD SHIFT", time: "11:00 - 08:00" },
        { name: "FOURTH SHIFT", time: "12:30 - 09:30" }
      ];

      // Core posts are staffed first; additional posts open one at a time.
      const coreLocations = [
        { name: "280 ft", shift: 0 },
        { name: "POS 1", shift: 0 },
        { name: "Group Counter", shift: 1 },
        { name: "SGF 1", shift: 1 },
        { name: "270 ft", shift: 1 },
        { name: "Upgrade (Steps)", shift: 1 },
        { name: "NAM 1", shift: 1 },
        { name: "NAM 2", shift: 1 },
        { name: "WOK 1", shift: 1 },
        { name: "WOK 2", shift: 1 },
        { name: "POS 2", shift: 2 },
        { name: "POS 3", shift: 2 },
        { name: "GF POS 1", shift: 2 },
        { name: "GF POS 2", shift: 2 },
        { name: "Divyanubhuti", shift: 2 },
        { name: "280 ft", shift: 3 },
        { name: "270 ft", shift: 3 },
        { name: "Upgrade (Steps)", shift: 3 },
        { name: "SGF 2", shift: 3 },
        { name: "L&F", shift: 3 },
        { name: "VIP Gate", shift: 3 },
        { name: "NAM 3", shift: 2 },
        { name: "NAM 4", shift: 3 },
        { name: "NAM 5", shift: 3 },
        { name: "WOK 3", shift: 2 },
        { name: "WOK 4", shift: 3 },
        { name: "WOK 5", shift: 3 }
      ];

      // Priority order for posts added after the core locations.
      const additionalLocations = [
        { name: "WOK 6", shift: 3 },
        { name: "POS 4", shift: 3 },
        { name: "Sangam", shift: 3 },
        { name: "NAM 6", shift: 3 },
        { name: "SGF 3", shift: 3 },
        { name: "WOK 7", shift: 3 },
        { name: "POS 5", shift: 3 },
        { name: "POS 6", shift: 3 },
        { name: "NAM 7", shift: 3 },
        { name: "POS 7", shift: 3 },
        { name: "POS 8", shift: 3 },
        { name: "NAM 8", shift: 3 },
        { name: "WOK 8", shift: 3 }
      ];

      const categoryOrder = [
        "Ticket Counter",
        "Statue",
        "Nij Aatma Manthan",
        "World of Krishna",
        "Park"
      ];

      // Read a non-negative whole-number value from an input.
      function readInput(id) {
        const value = Number(document.getElementById(id).value);
        return Number.isFinite(value) ? Math.max(0, Math.floor(value)) : 0;
      }

      // Map each location to its display category.
      function categoryFor(name) {
        if (name.startsWith("WOK")) return "World of Krishna";
        if (name.startsWith("NAM")) return "Nij Aatma Manthan";

        if (
          name.startsWith("POS") ||
          name.startsWith("GF POS") ||
          name === "Group Counter" ||
          name === "L&F"
        ) {
          return "Ticket Counter";
        }

        if (
          ["280 ft", "270 ft", "Upgrade (Steps)"].includes(name) ||
          name.startsWith("SGF")
        ) {
          return "Statue";
        }

        return "Park";
      }

      // Build the markup for one roster location.
      function locationMarkup(item) {
        return `
          <li>
            <span class="location-name">${item.name}</span>
            <span class="location-category">${categoryFor(item.name)}</span>
          </li>
        `;
      }

      // Return only locations assigned to the currently available staff.
      function getStaffedLocations(available) {
        if (available <= 26) return [];

        const coreCount = Math.min(available, coreLocations.length);
        const extras = additionalLocations.slice(
          0,
          Math.max(0, available - coreLocations.length)
        );
        const locations = [
          ...coreLocations.slice(0, coreCount),
          ...extras
        ].map(item => ({ ...item }));
        const namCount = locations.filter(item => item.name.startsWith("NAM ")).length;
        const wokCount = locations.filter(item => item.name.startsWith("WOK ")).length;

        if (namCount >= 7) {
          const namFour = locations.find(item => item.name === "NAM 4");
          if (namFour) namFour.shift = 2;
        }

        if (wokCount >= 7) {
          const wokFour = locations.find(item => item.name === "WOK 4");
          if (wokFour) wokFour.shift = 2;
        }

        if (locations.some(item => item.name === "POS 5")) {
          const posFour = locations.find(item => item.name === "POS 4");
          if (posFour) posFour.shift = 2;
        }

        return locations;
      }

      // Build a print roster containing the same assigned locations as the screen.
      function renderPrintRoster(total, weekOffs, leaves, available, locations) {
        document.getElementById("printSummary").innerHTML = `
          <span>Total Staff: ${total}</span>
          <span>Week offs: ${weekOffs}</span>
          <span>Leaves: ${leaves}</span>
          <span>Available: ${available}</span>
        `;

        document.getElementById("printShifts").innerHTML = shifts
          .map((shift, shiftIndex) => {
            const staffed = locations
              .filter(item => item.shift === shiftIndex)
              .sort(
                (a, b) =>
                  categoryOrder.indexOf(categoryFor(a.name)) -
                  categoryOrder.indexOf(categoryFor(b.name))
              );
            const list = staffed
              .map(item => `<li><span class="print-location-name">${item.name}</span><span class="print-location-category">${categoryFor(item.name)}</span><span class="print-staff-name" aria-hidden="true"></span></li>`)
              .join("");

            return `<section class="print-shift">
              <h2><span>${shift.name} [${shift.time}]</span><span>${staffed.length} STAFF</span></h2>
              <ul>${list}</ul>
            </section>`;
          })
          .join("");
      }

      // Build four compact print columns for 27 through 30 available staff.
      function renderMultiplePrintRoster() {
        document.getElementById("multiplePrintGrid").innerHTML = [27, 28, 29, 30]
          .map(available => {
            const locations = getStaffedLocations(available);
            const shiftBlocks = shifts
              .map((shift, shiftIndex) => {
                const staffed = locations.filter(item => item.shift === shiftIndex);
                if (staffed.length === 0) return "";

                return `<section class="multiple-print-shift">
                  <h3>${shift.time} [${staffed.length} staff]</h3>
                  <ul>${staffed.map(item => `<li>${item.name}</li>`).join("")}</ul>
                </section>`;
              })
              .join("");

            return `<article class="multiple-print-column">
              <h2>Total Staff: ${available}</h2>
              ${shiftBlocks}
            </article>`;
          })
          .join("");
      }

      // Recalculate availability and rebuild the roster.
      function render() {
        const total = readInput("total");
        const weekOffs = readInput("wo");
        const leaves = readInput("leave");
        const available = Math.max(0, total - weekOffs - leaves);
        const roster = document.getElementById("roster");
        const notStaffed = document.getElementById("notStaffed");
        const staffedLocations = getStaffedLocations(available);
        const absenceWarning = total >= 27
          ? `Too many combined absences. Keep week offs and leaves to ${total - 27} or fewer to have 27 staff available.`
          : "At least 27 total staff are needed. Reduce absences or increase total staff.";
        const showAbsenceWarning = available < 27;

        document.getElementById("sAvailable").textContent = available;
        renderPrintRoster(total, weekOffs, leaves, available, staffedLocations);
        renderMultiplePrintRoster();
        document.getElementById("woWarning").textContent = showAbsenceWarning
          ? absenceWarning
          : "";
        document.getElementById("leaveWarning").textContent = showAbsenceWarning
          ? absenceWarning
          : "";

        if (available <= 26) {
          roster.innerHTML = '<p class="threshold-message">Ab to Hiring karlo!</p>';
          notStaffed.hidden = true;
          notStaffed.innerHTML = "";
          return;
        }

        const staffedCoreCount = Math.min(available, coreLocations.length);
        const staffedExtraCount = Math.max(0, available - coreLocations.length);
        const uncoveredLocations = [
          ...coreLocations.slice(staffedCoreCount),
          ...additionalLocations.slice(staffedExtraCount)
        ];

        roster.innerHTML = shifts
          .map((shift, shiftIndex) => {
            const staffed = staffedLocations.filter(
              item => item.shift === shiftIndex
            );

            staffed.sort(
              (a, b) =>
                categoryOrder.indexOf(categoryFor(a.name)) -
                categoryOrder.indexOf(categoryFor(b.name))
            );

            const list = staffed.length
              ? `<ul class="location-list">${staffed.map(locationMarkup).join("")}</ul>`
              : '<p class="empty-shift">No locations staffed in this shift.</p>';

            return `
              <section class="shift" aria-label="${shift.name} [${shift.time}]">
                <div class="shift-header">
                  <span class="shift-name">${shift.name} [${shift.time}]</span>
                  <span class="shift-count">${staffed.length} STAFF</span>
                </div>
                ${list}
              </section>
            `;
          })
          .join("");

        if (available > 40) {
          const extraStaff = available - 40;
          roster.insertAdjacentHTML(
            "beforeend",
            `<p class="surplus-message">(${extraStaff} extra staff) we now have enough staff, aur nahi chahiye bas, dhanywaad</p>`
          );
        }

        notStaffed.hidden = uncoveredLocations.length === 0;
        if (uncoveredLocations.length > 0) {
          const locationList = uncoveredLocations
            .map(item => `
              <li>${item.name} · ${categoryFor(item.name)} · ${shifts[item.shift].name}</li>
            `)
            .join("");

          notStaffed.innerHTML = `<strong>Not staffed today</strong><ul>${locationList}</ul>`;
        } else {
          notStaffed.innerHTML = "";
        }
      }

      // Update the roster whenever staffing numbers change.
      ["total", "wo", "leave"].forEach(id => {
        document.getElementById(id).addEventListener("input", render);
      });

      document.querySelectorAll(".number-control button").forEach(button => {
        button.addEventListener("click", () => {
          const input = document.getElementById(button.dataset.target);
          const nextValue = Math.max(0, readInput(input.id) + Number(button.dataset.step));
          input.value = nextValue;
          input.dispatchEvent(new Event("input", { bubbles: true }));
        });
      });

      document.getElementById("printRoster").addEventListener("click", () => {
        document.body.classList.remove("multiple-print");
        window.print();
      });

      document.getElementById("printMultiple").addEventListener("click", () => {
        document.body.classList.add("multiple-print");
        window.print();
      });

      window.addEventListener("afterprint", () => {
        document.body.classList.remove("multiple-print");
      });

      render();
    </script>
  </body>
</html>
